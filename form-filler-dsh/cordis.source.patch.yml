# Source overlay for the experimental form-filler plugin:
#   pnpm dsh <profile> --patch ../profile-autocomplete/form-filler-dsh/cordis.source.patch.yml
# The entry below is anchored to this file and runs through the CLI's tsx
# loader, so no build and no profile install are needed. The plugin lives in
# the profile-autocomplete repo; it is no longer linked into deepseek-harness.
#
# Optional config (defaults shown):
#   host: 127.0.0.1
#   port: 8765            # the extension connects here
#   runDir: runs                  # relative to the session working directory
#   knowledgeDir: knowledge       # relative to the session working directory
#   attachmentsDir: attachments   # relative to the session working directory
#   cropSlotSize: 20              # component crops kept in the injected image memory
#
# All three directories are relative: they resolve under the session working
# directory, which is also the file sandbox's workspace-write boundary. Point
# the session at a workspace holding knowledge/ and attachments/ (one per
# résumé version or person) and the model reads the profile, uploads from the
# attachment set, and persists learned facts with its own write / edit tools.
# Per-observation DOM snapshots land under runs/<session>/<snapshot>/ there too.

- insert:
    - id: form-filler
      name: './src/index.ts'
      config:
        port: 8765
        knowledgeDir: knowledge
        attachmentsDir: attachments
