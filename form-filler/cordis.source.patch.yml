# Source overlay for the experimental form-filler plugin:
#   pnpm dsh <profile> --patch ./packages/experimental/form-filler/cordis.patch.yml
# The relative entry is anchored to this file and runs through the CLI's tsx
# loader, so no build and no profile install are needed.
#
# Optional config (defaults shown):
#   host: 127.0.0.1
#   port: 8765            # the extension connects here
#   runDir: $DSH_HOME/form-filler/runs
#   knowledgeDir: $DSH_HOME/form-filler/knowledge

- insert:
    - id: form-filler
      name: './src/index.ts'
      config:
        port: 8765
